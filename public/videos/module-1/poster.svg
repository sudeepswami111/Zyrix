<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="40%" r="60%" fx="50%" fy="30%">
      <stop offset="0%" stop-color="#3D2A22" />
      <stop offset="45%" stop-color="#241E1A" />
      <stop offset="100%" stop-color="#14110F" />
    </radialGradient>
    <linearGradient id="terracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E07A5F" />
      <stop offset="100%" stop-color="#C1502E" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#warmGlow)" />

  <!-- Subtle Editorial Grid & Geometry Lines -->
  <g opacity="0.12" stroke="#E6DCC8" stroke-width="1" stroke-dasharray="4 6">
    <line x1="160" y1="0" x2="160" y2="720" />
    <line x1="1120" y1="0" x2="1120" y2="720" />
    <line x1="0" y1="180" x2="1280" y2="180" />
    <line x1="0" y1="540" x2="1280" y2="540" />
    <circle cx="640" cy="360" r="280" stroke="#C1502E" stroke-width="1.5" />
    <circle cx="640" cy="360" r="180" stroke="#E07A5F" stroke-width="1" />
  </g>

  <!-- Top Brand Mark -->
  <g transform="translate(64, 48)">
    <rect width="36" height="36" rx="8" fill="#C1502E" />
    <path d="M12 12.5C12 11.67 12.67 11 13.5 11H22.5C23.33 11 24 11.67 24 12.5C24 13.02 23.73 13.49 23.3 13.76L14.8 19.5H22.5C23.33 19.5 24 20.17 24 21C24 21.83 23.33 22.5 22.5 22.5H13.5C12.67 22.5 12 21.83 12 21C12 20.48 12.27 20.01 12.7 19.74L21.2 14H13.5C12.67 14 12 13.33 12 12.5Z" fill="#FBF6EF" />
    <text x="48" y="24" fill="#F1E2CF" font-family="system-ui, sans-serif" font-weight="600" font-size="18" letter-spacing="0.5">Zyrix</text>
  </g>

  <!-- Format Badge Top Right -->
  <g transform="translate(1040, 48)">
    <rect width="176" height="32" rx="16" fill="#2E241E" stroke="#4A3B30" />
    <text x="88" y="21" fill="#E07A5F" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1">STUDIO LESSON</text>
  </g>

  <!-- Center Content -->
  <g transform="translate(640, 310)">
    <!-- Episode Tag -->
    <rect x="-110" y="-120" width="220" height="30" rx="15" fill="#3D2920" stroke="#663A2A" />
    <text x="0" y="-100" fill="#F1E2CF" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.5">MODULE 1 • EPISODE 1</text>

    <!-- Main Title -->
    <text x="0" y="-30" fill="#FBF6EF" font-family="Georgia, serif" font-size="52" font-weight="bold" text-anchor="middle" letter-spacing="-0.5">What Is Python?</text>

    <!-- Subtitle -->
    <text x="0" y="15" fill="#D8CEBC" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle" opacity="0.9">The Mental Model: Execution, Dynamic Typing &amp; Memory</text>

    <!-- Center Play Button Orb -->
    <g transform="translate(0, 95)">
      <circle cx="0" cy="0" r="42" fill="url(#terracottaGrad)" />
      <polygon points="-8,-16 -8,16 16,0" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(640, 660)">
    <text x="0" y="0" fill="#A89F91" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">Click to play video • Full audio walkthrough • 1080p HD</text>
  </g>
</svg>
